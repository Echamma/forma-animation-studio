name: Desktop release
# Publishes only from a version tag (v1.2.0) whose number matches package.json, so a push can never overwrite a release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi
  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2 fonts-liberation
      - run: npm ci
      - name: Test the desktop editor on Linux
        run: xvfb-run -a npm test
      - name: Build AppImage and Debian packages
        run: npm run build
      - name: Start and verify the packaged Linux app
        run: xvfb-run -a dist/linux-unpacked/forma-animation-studio --smoke-test
      - name: Calculate package checksums
        run: |
          cd dist
          sha256sum *.AppImage *.deb forma-mcp.cjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: forma-animation-studio-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/forma-mcp.cjs
            dist/SHA256SUMS
            dist/latest-linux.yml
          if-no-files-found: error
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Verify the packaged Windows editor
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/win-unpacked/Forma Animation Studio.exe' -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged editor smoke test failed' }
      - name: Calculate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/ -Filter '*.exe' | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower() + '  ' + $_.Name
          } | Set-Content dist/SHA256SUMS-Windows -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: forma-animation-studio-windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS-Windows
          if-no-files-found: error
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forma-animation-studio-*
          path: dist
          merge-multiple: true
      - name: Publish verified desktop apps and MCP bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Forma $version — Desktop and MCP" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
