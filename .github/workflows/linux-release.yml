name: Linux desktop release
on:
  push:
    branches: [linux]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linux-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2 fonts-liberation
      - run: npm ci
      - name: Test the desktop editor on Linux
        run: xvfb-run -a npm test
      - name: Build AppImage and Debian packages
        run: npm run build
      - name: Start and verify the packaged Linux app
        run: xvfb-run -a dist/linux-unpacked/forma-animation-studio --smoke-test
      - name: Calculate package checksums
        run: |
          cd dist
          sha256sum *.AppImage *.deb forma-mcp.cjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: forma-animation-studio-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/forma-mcp.cjs
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="linux-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Forma $version — Desktop and MCP" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/*.AppImage dist/*.deb dist/forma-mcp.cjs dist/SHA256SUMS --clobber
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Verify the packaged Windows editor
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/win-unpacked/Forma Animation Studio.exe' -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged editor smoke test failed' }
      - name: Calculate Windows checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem dist/ -Filter '*.exe' | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
          ($hash.Hash.ToLower() + '  ' + $file.Name) | Set-Content dist/SHA256SUMS-Windows -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: forma-animation-studio-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS-Windows
          if-no-files-found: error
      - name: Publish Windows desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="linux-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Forma $version — Desktop and MCP" --notes-file RELEASE_NOTES.md || gh release view "$tag"
          fi
          gh release upload "$tag" dist/*.exe dist/SHA256SUMS-Windows --clobber
